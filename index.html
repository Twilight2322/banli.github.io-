<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banli.com</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="auth-screen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-logo"><span class="logo-icon">◆</span></div>
            <h1 class="auth-title">欢迎来到Banli🌰的空间</h1>
            <p class="auth-subtitle">记录生活 · 收藏作品</p>
            <form id="auth-form" class="auth-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required>
                    <label>你的名称</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder=" " required>
                    <label>设置密码</label>
                </div>
                <div class="input-group" id="confirm-group" style="display:none;">
                    <input type="password" id="confirm-password" placeholder=" ">
                    <label>确认密码</label>
                </div>
                <p id="auth-error" class="auth-error"></p>
                <button type="submit" class="auth-btn">创建账号</button>
                <p class="auth-switch"><span id="auth-switch-text">已有账号？</span><a href="#" id="auth-switch-btn">直接登录</a></p>
            </form>
        </div>
    </div>

    <div id="main-screen" style="display:none;">
        <nav class="navbar">
            <div class="nav-brand"><span class="logo-icon">◆</span><span id="nav-username"></span></div>
            <div class="nav-links">
                <a href="#" class="nav-link active" data-page="home">首页</a>
                <a href="#" class="nav-link" data-page="life">生活记录</a>
                <a href="#" class="nav-link" data-page="works">作品集</a>
                <button id="theme-btn" class="theme-btn">🎨 主题</button>
                <button id="logout-btn" class="logout-btn">退出</button>
            </div>
        </nav>

        <section id="page-home" class="page active">
            <div class="feed-container" id="feed-list"></div>
            <div id="feed-empty" class="empty-state">
                <p>还没有动态</p>
                <p class="empty-hint">去「生活记录」或「作品集」添加内容吧</p>
            </div>
        </section>

        <section id="page-life" class="page">
            <div class="section-header">
                <h2>生活记录</h2>
                <button class="add-btn" onclick="openModal('life')">+ 新建记录</button>
            </div>
            <div id="life-list" class="card-grid"></div>
            <div id="life-empty" class="empty-state"><p>还没有生活记录</p></div>
        </section>

        <section id="page-works" class="page">
            <div class="section-header">
                <h2>作品集</h2>
                <button class="add-btn" onclick="openModal('work')">+ 添加作品</button>
            </div>
            <div id="works-list" class="card-grid"></div>
            <div id="works-empty" class="empty-state"><p>还没有收藏作品</p></div>
        </section>
    </div>

    <div id="theme-modal" class="modal" onclick="closeThemeModal(event)">
        <div class="modal-content theme-modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>选择主题色</h3>
                <button class="close-btn" onclick="closeThemeModal()">&times;</button>
            </div>
            <div class="theme-section">
                <h4>基础颜色</h4>
                <div class="theme-grid" id="basic-themes"></div>
            </div>
            <div class="theme-section">
                <h4>长沙地铁</h4>
                <div class="theme-grid" id="changsha-themes"></div>
            </div>
            <div class="theme-section">
                <h4>广州地铁</h4>
                <div class="theme-grid" id="guangzhou-themes"></div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modal-title">新建</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="modal-form" onsubmit="saveItem(event)">
                <input type="hidden" id="item-type">
                <input type="hidden" id="item-id">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="item-title" required>
                </div>
                <div class="form-group">
                    <label>内容</label>
                    <textarea id="item-content" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>图片</label>
                    <input type="file" id="item-image" accept="image/*" onchange="previewImage(event)">
                    <div id="image-preview" class="image-preview"></div>
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="item-date" required>
                </div>
                <div class="form-group">
                    <label>标签（用逗号分隔）</label>
                    <input type="text" id="item-tags" placeholder="例如：旅行, 美食">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="share-modal" class="modal" onclick="closeShareModal(event)">
        <div class="modal-content share-modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>分享到微信</h3>
                <button class="close-btn" onclick="closeShareModal()">&times;</button>
            </div>
            <div class="share-content">
                <p>请截图保存二维码，用微信扫码打开</p>
                <div id="qrcode" class="qrcode"></div>
                <p class="share-url" id="share-url"></p>
                <button class="btn-primary" onclick="copyShareLink()">复制链接</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
